pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    format:
      run: hooks/format/run_prettier.sh
    repo-analysis:
      run: hooks/quality/validate_repo_analysis.sh
    # rulesync 生成物の drift 検査。生成物を触った commit のときだけ走らせる。
    #
    # .rulesync/ は sdd-template への symlink かつ .gitignore 対象なので、
    # glob に .rulesync/** を書いても staged file としては決して一致しない。
    # 「正本を編集して生成を忘れた」commit は生成物が staged にならないため
    # 本 hook では捕まらない (検出は check-generated の手動実行が担う)。
    # ここで捕まえるのは「生成物を手編集した」「再生成の結果が中途半端」の 2 つ。
    #
    # 正本が link されていない環境では exit 2 (検査不能) を返すので、
    # 合格扱いにせずスキップとして通す。
    rulesync-generated-drift:
      glob:
        - "AGENTS.md"
        - "CLAUDE.md"
        - ".agents/**"
        - ".claude/**"
        - ".codex/**"
        - ".cursor/**"
        - ".mcp.json"
        - "scripts/generate.sh"
        - "scripts/check-generated.sh"
      run: scripts/check-generated.sh --staged || [ $? -eq 2 ]
    # Go の依存方向 gate。import かルール自体を
    # 触ったときだけ走らせる (毎 commit で linter を起動しない)。
    #
    # glob は staged file に対して評価されるので、ファイル削除だけの commit
    # では skip される。その穴は CI 側の同じ検査が塞ぐ。
    go-depguard:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "core/.golangci.yml"
        - "scripts/golangci-lint.sh"
      run: scripts/golangci-lint.sh ./...
    # 依存図の drift 検査: 実 import が変わったのに architecture.md の
    # 生成区間を更新していない状態を検出する。生成側 (スクリプト) と
    # 生成先 (architecture.md) の手編集も同じ検査で拾う。
    #
    # lefthook の run は sh -c で実行され set -e が効かない。複数行にすると
    # 終了コードが最後のコマンドのものになり、生成の失敗を git diff が
    # 握り潰す (図が更新されないので差分ゼロ = 緑) ため && で連結する。
    go-depgraph-drift:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "scripts/depgraph.sh"
        - "context/architecture.md"
      run: scripts/depgraph.sh && git diff --exit-code context/architecture.md

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
