# git hooks。有効化: pnpm install (prepare が lefthook install を実行する)

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    # 整形した結果だけを stage_fixed で staging へ戻す。明示的な git add を使うと、
    # 部分 stage したファイルの未 stage 変更まで commit に巻き込む。
    prettier:
      glob: "*.{md,yml,yaml,json}"
      run: pnpm exec prettier --write --ignore-unknown -- {staged_files}
      stage_fixed: true
    # 文章の規則。経緯の混入とリンクは編集後のフックと CI が見る
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}
    # Go の lint (depguard の依存方向と、revive の export した識別子の doc)。
    # Go のファイルか lint の設定を触ったときだけ走らせる (毎 commit で linter を起動しない)。
    #
    # glob は staged file に対して評価されるので、ファイル削除だけの commit
    # では skip される。その穴は CI 側の同じ検査が塞ぐ。
    go-lint:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "core/.golangci.yml"
        - "scripts/golangci-lint.sh"
      run: scripts/golangci-lint.sh ./...
    # 依存図の drift 検査: 実 import が変わったのに design/DesignDoc.md の
    # 生成区間を更新していない状態を検出する。生成側 (スクリプト) と
    # 生成先 (design/DesignDoc.md) の手編集も同じ検査で拾う。
    #
    # lefthook の run は sh -c で実行され set -e が効かない。複数行にすると
    # 終了コードが最後のコマンドのものになり、生成の失敗を git diff が
    # 握り潰す (図が更新されないので差分ゼロ = 緑) ため && で連結する。
    go-depgraph-drift:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "scripts/depgraph.sh"
        - "design/DesignDoc.md"
      run: scripts/depgraph.sh && git diff --exit-code design/DesignDoc.md

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # 形式と AI の帰属表示の禁止は commitlint.config.mjs が持つ
    commitlint:
      run: pnpm exec commitlint --edit {1}
