pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    format:
      run: hooks/format/run_prettier.sh
    repo-analysis:
      run: hooks/quality/validate_repo_analysis.sh
    # Go の依存方向 gate。import かルール自体を
    # 触ったときだけ走らせる (毎 commit で linter を起動しない)。
    #
    # glob は staged file に対して評価されるので、ファイル削除だけの commit
    # では skip される。その穴は CI 側の同じ検査が塞ぐ。
    go-depguard:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "core/.golangci.yml"
        - "scripts/golangci-lint.sh"
      run: scripts/golangci-lint.sh ./...
    # 依存図の drift 検査: 実 import が変わったのに architecture.md の
    # 生成区間を更新していない状態を検出する。生成側 (スクリプト) と
    # 生成先 (architecture.md) の手編集も同じ検査で拾う。
    #
    # lefthook の run は sh -c で実行され set -e が効かない。複数行にすると
    # 終了コードが最後のコマンドのものになり、生成の失敗を git diff が
    # 握り潰す (図が更新されないので差分ゼロ = 緑) ため && で連結する。
    go-depgraph-drift:
      glob:
        - "core/**/*.go"
        - "core/*.go"
        - "scripts/depgraph.sh"
        - "context/architecture.md"
      run: scripts/depgraph.sh && git diff --exit-code context/architecture.md
    # 読み取りマップの drift 検査。frontmatter を変えたのに生成し直していない
    # 状態を検出する。生成側 (スクリプト) と生成先の手編集も同じ検査で拾う。
    #
    # 入力が全対象文書の frontmatter なので depgraph のように狭い glob へは
    # 絞れない (ADR-0008 決定 3)。frontmatter の先頭ブロックを読むだけで
    # lint 起動を伴わないためコストは小さい。
    #
    # lefthook の run は sh -c で実行され set -e が効かないので && で連結する。
    reading-map-drift:
      glob:
        - "design/**/*.md"
        - "context/**/*.md"
        - "context/reading-map.yaml"
        - "scripts/reading-map.sh"
        - "scripts/docmeta.py"
      run: scripts/reading-map.sh && git diff --exit-code context/reading-map.yaml context/README.md

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push
    # 生成物 drift の全体検査。pre-commit 側は staged file に対する glob で
    # 発火するため「テンプレが先に進み、こちらが再生成していない」ケースを
    # 捕まえられない (生成物が staged にならないので何も起きない)。
    #

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
