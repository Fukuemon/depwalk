# 文章の規則。どのプロジェクトでも成り立つものだけを置く。プロジェクトの用語の規則は、この下に足す
version: 1

rules:
  - expected: 名前で指す
    pattern: /\b(?!S3\b|M[1-4]\b|V8\b|D1\b|R2\b)(?:DQ|[GSMQRVD])\d{1,2}\b/
    prh: 記号の採番は使わない。記号だけでは、その文が単独で意味を持たない。名前やセクションの見出しで指す
  - expected: この文書に必要な事実だけを書く
    pattern: /(?:詳細|実現方法|調査結果|選定|結果|書式)は、?\s?(?:DesignDoc|Design Doc|PRD|ADR)(?:\.md)?\s?(?:に|で)(?:書|定め|記載)/
    prh: 「詳細は Design Doc に書く」のような案内文は書かない。内容は各文書の中で完結させる
  - expected: 日付を書かない
    pattern: /\d{4}\s?年(?!分|間|目|以上|後|前|ごと)(?:\s?\d{1,2}\s?月)?/
    prh: 文書に日付を書かない。履歴はコミットから読み取れる。バージョンなど、日付を使わずに時点を特定できる情報で書く
  - expected: 更新日を書かない
    pattern: /\bUpdated:/
    prh: 文書に更新日を書かない。履歴はコミットから読み取れる
  - expected: 次の $1 つ$2。
    pattern: /次の\s?(\d+)\s?つ(だけ)?である。/
    prh: 箇条書きや表を導く文は体言止めにする。「である」を重ねると不自然に読める
  - expected: 例は次の $1 つ。
    pattern: /次の\s?(\d+)\s?つが例である。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: 次のとおり。
    pattern: /次のとおりである。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: $1バージョン
    pattern: /(新しい|古い|最新の|最初の|次の|前の|同じ|別の|特定の|誤った|取り消した)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 新しい版を出す
        to: 新しいバージョンを出す
  - expected: バージョン
    pattern: /(?<!(?:語|\d\s?|[A-Za-z]\s?|無料|有料|体験|製品|完全|簡易|限定|特別|海外|国内|ベータ|デスクトップ|モバイル|スマホ))版(?=[をがはもにで]?(?:上げ|上が|下げ|戻|固定|指定|揃|そろ|ずれ|変え|書き換|宣言|定め|管理|置き場|所在|決め方|そのもの|更新))/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 版を上げる
        to: バージョンを上げる
      - from: 日本語版を更新する
        to: 日本語版を更新する
      - from: Web 版を更新する
        to: Web 版を更新する
  - expected: $1$2バージョン
    pattern: /([A-Za-z0-9`]|ツール|パッケージ|プラグイン|ライブラリ|ランタイム|依存|schema)(\s?の\s?)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: Node.js の版
        to: Node.js のバージョン
      - from: 日本語版の違い
        to: 日本語版の違い
      - from: ツールの版
        to: ツールのバージョン
  # 技術者がカタカナ語で呼ぶ技術用語。文脈で意味が変わる語（表、列、題、写す、取り込む）は、スキル write-prose の規則で判断し、ここに置かない
  - expected: デフォルト値
    pattern: /既定の?値/
    prh: default value はデフォルト値と書く
    specs:
      - from: 既定の値を使う
        to: デフォルト値を使う
      - from: 既定値を変える
        to: デフォルト値を変える
  - expected: デフォルト$1
    pattern: /既定(?!の?値)(では|で|は|の|に|を|と|から)/
    prh: default はデフォルトと書く
    specs:
      - from: 既定では無効
        to: デフォルトでは無効
      - from: 既定のブランチ
        to: デフォルトのブランチ
  - expected: テンプレート
    pattern: 雛形
    prh: template はテンプレートと書く
    specs:
      - from: issue の雛形
        to: issue のテンプレート
  - expected: リクエスト$1レスポンス
    pattern: /要求(と|や|、)応答/
    prh: HTTP の request と response は、リクエストとレスポンスと書く
    specs:
      - from: 要求と応答を記録する
        to: リクエストとレスポンスを記録する
  - expected: $1$2の$3テーブル
    pattern: /(DB|データベース)(\s?)の(\s?)表(?![現示記])/
    prh: DB の table はテーブルと書く。Markdown の表は検出しない
    specs:
      - from: DB の表の名前
        to: DB のテーブルの名前
      - from: DB の表現力
        to: DB の表現力
  - expected: ローカル環境
    pattern: 手元の環境
    prh: 開発者のマシンの環境は、ローカル環境と書く
    specs:
      - from: 手元の環境で試す
        to: ローカル環境で試す
  - expected: ローカル環境で
    pattern: /手元で(?=動か|起動|実行)/
    prh: 開発者のマシンで動かすことは、ローカル環境で起動する、のように書く
    specs:
      - from: 手元で動かす
        to: ローカル環境で動かす
      - from: 手元で扱う
        to: 手元で扱う
  - expected: シークレット
    patterns:
      - 秘密の値
      - 秘密情報
      - 秘密の情報
    prh: secret はシークレットと書く
    specs:
      - from: 秘密情報の置き場
        to: シークレットの置き場
  # 確かめるは、技術者が普段使う確認するに揃える。活用と後ろに続く語ごとに置き換えの形が違うので、規則を分ける
  - expected: 確認が必要な
    pattern: /確かめが要る(?=\s?[一-龠々ァ-ヶ「`A-Za-z0-9]|もの|こと|とき|ところ|ため|はず|わけ|ほう|よう|の|ほど|だけ)/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く。名詞と「の」「ほど」「だけ」の前は確認が必要なと書く
    specs:
      - from: 確かめが要る予定
        to: 確認が必要な予定
      - from: 確かめが要るはず
        to: 確認が必要なはず
      - from: 確かめが要る API
        to: 確認が必要な API
      - from: 確かめが要るほど
        to: 確認が必要なほど
      - from: 確かめが要るのは
        to: 確認が必要なのは
  - expected: 確認が必要だ
    pattern: /確かめが要る(?=が|から|けど|けれど|し|と(?!き|ころ))/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く。「が」「から」「けど」「し」「と」の前は確認が必要だと書く
    specs:
      - from: 確かめが要るが
        to: 確認が必要だが
      - from: 確かめが要るから
        to: 確認が必要だから
      - from: 確かめが要ると書く
        to: 確認が必要だと書く
  - expected: 確認が必要
    pattern: /確かめが要る(?!\s?[一-龠々ァ-ヶ「`A-Za-z0-9]|もの|こと|とき|ところ|ため|はず|わけ|ほう|よう|の|ほど|だけ|が|から|けど|けれど|し|と(?!き|ころ))/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 差分の確かめが要る
        to: 差分の確認が必要
      - from: 確かめが要るか
        to: 確認が必要か
      - from: 確かめが要るとき
        to: 確かめが要るとき
  - expected: 確認が必要
    pattern: 確かめが必要
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 確かめが必要のない
        to: 確認が必要のない
      - from: 確かめが必要な予定
        to: 確認が必要な予定
  - expected: 確認する
    pattern: 確かめる
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 差分を確かめる
        to: 差分を確認する
  - expected: 確認し$1
    pattern: /確かめ(なけれ|なかっ|なく|ない|た|て|ます|よう|直)/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 差分を確かめて直す
        to: 差分を確認して直す
      - from: 差分を確かめなければならない
        to: 差分を確認しなければならない
      - from: 差分を確かめなくてよい
        to: 差分を確認しなくてよい
  - expected: 確認し
    pattern: /確かめ(?=、)/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 差分を確かめ、直す
        to: 差分を確認し、直す
  - expected: 確認すれば
    pattern: 確かめれば
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
  - expected: 確認せず
    pattern: 確かめず
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
  - expected: 確認でき
    pattern: 確かめられ
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く。可能の意味なら確認できる、受け身の意味なら確認されると書く
    specs:
      - from: 値が確かめられる
        to: 値が確認できる
  - expected: 確認の方法
    pattern: 確かめ方
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 確かめ方は次のとおり
        to: 確認の方法は次のとおり
  - expected: 確認
    pattern: /確かめ(?=[のはをとも]|が(?!(?:要る|必要)))/
    prh: 確かめるは、技術者が普段使う語に揃え、確認すると書く
    specs:
      - from: 値の確かめは要らない
        to: 値の確認は要らない
  # 画面の background。地の文、地図、地味、地下、下地、現地のような地は検出しない。コードスパンの後の地（`body` の地）は、スキル write-prose の規則で判断する
  - expected: $1の背景
    pattern: /(画面|ページ|入力欄|カード|ボタン|ダイアログ|ヘッダー|セル)の地(?!の文|[図点域名方帯面味下])/
    prh: 画面の background は、CSS とデザインシステムの呼び方に揃え、背景と書く
    specs:
      - from: 画面の地にする
        to: 画面の背景にする
      - from: 画面の地図を描く
        to: 画面の地図を描く
      - from: 画面の地味な色
        to: 画面の地味な色
      - from: ページの地下
        to: ページの地下
  - expected: 背景の色
    pattern: /(?<![一-龠々ァ-ヶの])地の色/
    prh: 画面の background は、CSS とデザインシステムの呼び方に揃え、背景と書く
    specs:
      - from: 地の色を見る
        to: 背景の色を見る
      - from: 下地の色を塗る
        to: 下地の色を塗る
      - from: 現地の色を写す
        to: 現地の色を写す
  - expected: 何をどう決めたかを書く
    pattern: /側に倒[さしすせそ]/
    prh: 判断を方向の比喩で書かない。「失敗したら処理を止める」のように、決めた動作を書く
    specs:
      - from: 安全側に倒す
        to: 安全何をどう決めたかを書く
  - expected: 起きることを書く
    patterns:
      - /引き返[さしすせそ]/
      - 収斂
      - 沈黙
    prh: 比喩の動詞を使わない。「元の状態に戻す」「エラーを出さずに終了する」のように、起きる操作や状態を書く
    specs:
      - from: 処理が沈黙する
        to: 処理が起きることを書くする
  - expected: 間違え
    pattern: 取り違え
    prh: 比喩の動詞を使わない
    specs:
      - from: 設定を取り違えた
        to: 設定を間違えた
  - expected: 比べた結果を書く
    patterns:
      - 主役
      - 別物
      - 桁違い
    prh: 評価を装う名詞を使わない。何がどう違うか、どれだけ違うかを書く
    specs:
      - from: 両者は別物である
        to: 両者は比べた結果を書くである
  - expected: 確認した事実を書く
    patterns:
      - 手触り
      - 肌感
      - 温度感
      - 腹落ち
      - /解像度[をがの]?(?:上げ|上が|高)/
      - /本質(?:的)?/
    prh: 質感や理解を装う語を使わない。行った操作、読んだもの、測った値を書く
    specs:
      - from: 解像度を上げる
        to: 確認した事実を書くる
  - expected: 具体的な出来事を書く
    patterns:
      - 真理
      - 境地
      - 美学
      - 深淵
      - 羅針盤
      - 起爆剤
    prh: 体験や判断を大げさな語で言わない
    specs:
      - from: 設計の美学
        to: 設計の具体的な出来事を書く
  - expected: 前置きを削る
    patterns:
      - /(?:まず|ここで)?重要なのは、?/
      - /結論から言うと、?/
      - /正直に言うと、?/
      - /注目すべき(?:点|こと)がある。?/
    prh: 前置きを書かず、言いたいことから書き始める
    specs:
      - from: 重要なのは、テストである
        to: 前置きを削るテストである
  - expected: 言い切る
    patterns:
      - /に他な(?:らない|らず|らぬ|らなかった|りません)/
      - /と言える(?:でしょう|だろう)/
    prh: 文末を飾らず、事実を言い切る
    specs:
      - from: 設定の誤りに他ならない
        to: 設定の誤り言い切る
      - from: 設定の誤りに他なりません
        to: 設定の誤り言い切る
  - expected: 結びの定型を削る
    patterns:
      - /いかがでした(?:でしょう)?か/
      - 参考になれば幸い
    prh: 読み手への形だけの呼びかけで結ばない
    specs:
      - from: いかがでしたか
        to: 結びの定型を削る

  # ここから下は depwalk の用語の規則
  - expected: diagnostic
    pattern: /(?<![\w/.-])diagnostics(?![\w.])/
    prh: Protocol の record は diagnostic と error に分かれ、diagnostics は error を含むかが曖昧になる。diagnostic か「diagnostic と error の record」と書く。stderr の人間向けの出力はログと書く
    specs:
      - from: 件数の要約と diagnostics だけを出す
        to: 件数の要約と diagnostic だけを出す
      - from: expected/diagnostics.json にある
        to: expected/diagnostics.json にある
  - expected: バージョンの管理
    pattern: /(?<!(?:語|\d\s?|[A-Za-z]\s?))版の管理/
    prh: ソフトウェアの version はバージョンと書く。共通の規則は「版の管理」を検出しない
    specs:
      - from: JSON の schema と版の管理
        to: JSON の schema とバージョンの管理
      - from: 日本語版の管理
        to: 日本語版の管理
  - expected: 最初の Analyzer
    pattern: 初号機
    prh: Java Analyzer を指すときは、context と同じく「最初の Analyzer」と書く
    specs:
      - from: 初号機 (Java) の導入
        to: 最初の Analyzer (Java) の導入
  - expected: 自動 discovery
    pattern: /自動の\s?discovery/
    prh: source root を指定しないときに Gradle の build model から取得することは、context/domain.md の用語の「自動 discovery」と書く
    specs:
      - from: 自動の discovery と明示の override
        to: 自動 discovery と明示の override
  - expected: E2E の CLI 層
    pattern: /(?:実\s?CLI\s?の|CLI\s?のプロセスの|CLI\s?の層の|CLI\s?の)\s?E2E/
    prh: 実際の CLI のプロセスを動かす E2E は、context/testing.md のテストの種類の名前の「E2E の CLI 層」と書く
    specs:
      - from: CLI のプロセスの E2E で確かめる
        to: E2E の CLI 層 で確かめる
      - from: 実 CLI の E2E の
        to: E2E の CLI 層 の
  - expected: 削除
    pattern: /(?<![-\w])closeout(?![-.\w])|清算/
    prh: spec を消すことは、スキル write-design-docs と同じく「削除」と書く。workflow の名前の spec-closeout は識別子なので検出しない
    specs:
      - from: spec を清算する
        to: spec を削除する
      - from: spec-closeout.yml が作る
        to: spec-closeout.yml が作る
