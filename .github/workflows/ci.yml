name: CI

# NOTE: setup-java / setup-go の重複は現状 2-3 箇所に収まる規模のため
# composite action 化していない。job が増えて setup 記述が 3 箇所以上に
# 重複するようになったら .github/actions/ へ composite action として抽出する。

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-quality:
    name: "Go quality (fmt / vet / build / test)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      # E2E テストは JDK 不在時に自動 skip されるため、この job に JVM は含めない
      # (JVM が必要な検証は java-analyzer / e2e job が担う)。

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: core

      - name: go vet
        run: go vet ./...
        working-directory: core

      - name: go build
        run: go build ./...
        working-directory: core

      - name: go test
        run: go test ./...
        working-directory: core

      - name: go mod tidy diff check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
        working-directory: core

      - name: Dependency direction gate (depguard)
        run: scripts/golangci-lint.sh ./...

      - name: Dependency graph drift check
        run: |
          # 実 import が変わったのに design/DesignDoc.md の生成区間を再生成して
          # いない状態を検出する (手描き図が静かに腐るのを構造的に防ぐ)。
          scripts/depgraph.sh
          if ! git diff --exit-code design/DesignDoc.md; then
            echo "::error::design/DesignDoc.md の依存図が実 import と一致しません。scripts/depgraph.sh を実行して結果を commit してください"
            exit 1
          fi

      - name: Dependency boundary gate (core must not depend on analyzers/)
        run: |
          # grep の対象を本 repo 自身の analyzers/<language> import に絞る。
          # "analyzers/" の部分一致ではなく path prefix で照合する。import path に
          # たまたま "analyzers/" を含むだけの third-party 依存を、境界違反として
          # 誤検出しないため。
          if go list -deps ./... | grep -E "^github.com/Fukuemon/depwalk/analyzers/"; then
            echo "core must not depend on analyzers/<language>/ packages"
            exit 1
          fi
        working-directory: core

  java-analyzer:
    name: "Java Analyzer (unit tests / fat jar)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test Java Analyzer
        run: ./gradlew test shadowJar
        working-directory: analyzers/java

      - name: Upload Java Analyzer fat jar
        uses: actions/upload-artifact@v4
        with:
          name: java-analyzer-jar
          path: analyzers/java/build/libs/java-analyzer.jar
          retention-days: 1

  e2e:
    name: "E2E (depwalk analyze × real jar)"
    needs: java-analyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Download Java Analyzer fat jar
        uses: actions/download-artifact@v4
        with:
          name: java-analyzer-jar
          path: analyzers/java/build/libs/

      - name: Assert jar is at expected path
        run: ls -l analyzers/java/build/libs/java-analyzer.jar

      - name: Build Spring fixture classpath
        run: ./analyzers/java/gradlew --no-daemon -p testdata/fixtures/java/spring-project writeDepwalkClasspath

      - name: Run Go E2E tests
        run: go test ./e2e/... -v
        working-directory: core
        env:
          # 前提 (JDK 25、analyzer jar) が欠けたら skip ではなく fail させる。
          # JDK 検出や jar の取得が壊れたとき、この job が黙って no-op の
          # 緑になるのを防ぐ (core/e2e/java_fixture_test.go の skipOrFail)。
          DEPWALK_E2E_REQUIRED: "1"

  docs:
    name: "Docs (文書のチェック)"
    runs-on: ubuntu-latest
    steps:
      # list-drift.mjs が Git の履歴を全部読む
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node.js、pnpm、apm の版は mise.toml にある
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      # docs のチェックは apm の配置先にあり、Git で追跡しない
      - run: apm install --frozen

      # prh.yml に規則を足すと、変えていない文書にも指摘が出る。全文書を見る
      - name: textlint
        run: git ls-files -z '*.md' | xargs -0 pnpm exec textlint

      - run: node .claude/hooks/docs/hooks/check-history.mjs
      - run: node .claude/hooks/docs/hooks/check-links.mjs

      # 実装が変わった文書の一覧。失敗にはしない
      - run: node .claude/hooks/docs/hooks/list-drift.mjs
        continue-on-error: true
